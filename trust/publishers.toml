[[publisher]]
name = "Microsoft Windows"
common_name = "Microsoft Windows"
organization = "Microsoft Corporation"
anchor = "microsoft-root"
signs = """\
Windows itself: its system files, most of them through the catalogues that \
Windows keeps and some in the file. Not Microsoft's applications, which are \
signed as Microsoft Corporation, and not the drivers and components of \
other companies, which Microsoft signs under other names."""
reason = """\
The files of Windows are the largest body of clean files on any machine, \
and published rules have flagged files in System32 on a hosted runner and \
on a desktop (docs/BENCHMARKS.md). Decided on 2026-11-21: the list starts \
with Microsoft and the Windows catalogue."""
added = 2026-11-21

