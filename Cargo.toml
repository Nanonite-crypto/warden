[workspace]
resolver = "3"
members = ["crates/warden-sigdb", "crates/warden-engine", "crates/warden-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Vevang Technologies"]
repository = "https://github.com/Nanonite-crypto/warden"
publish = false

[workspace.dependencies]
warden-engine = { path = "crates/warden-engine" }
warden-sigdb = { path = "crates/warden-sigdb" }

anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
crossbeam-channel = "0.5.17"
memchr = "2.7"
ctrlc = "3.5.2"
memmap2 = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "serde"] }
walkdir = "2.5.0"

# Pinned exactly: Warden walks archives with the reader in `zip::unstable`,
# which keeps memory use independent of the number of members and may change
# in any release. Only the two deflate variants are built; members packed any
# other way are reported, not unpacked.
zip = { version = "=9.7.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

# Test and benchmark only.
assert_cmd = "2.2.2"
criterion = "0.8.2"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.bench]
inherits = "release"
