[workspace]
resolver = "3"
members = [
    "crates/warden-sigdb",
    "crates/warden-engine",
    "crates/warden-yara",
    "crates/warden-pe",
    "crates/warden-quarantine",
    "crates/warden-trust",
    "crates/warden-cli",
    "crates/warden-calibrate",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Vevang Technologies"]
repository = "https://github.com/Nanonite-crypto/warden"
publish = false

[workspace.dependencies]
warden-engine = { path = "crates/warden-engine" }
warden-pe = { path = "crates/warden-pe" }
warden-yara = { path = "crates/warden-yara" }
warden-sigdb = { path = "crates/warden-sigdb" }
warden-quarantine = { path = "crates/warden-quarantine" }
warden-trust = { path = "crates/warden-trust" }

anyhow = "1.0.104"
# Decodes the hashes in the block map of an app package, which are written
# in base64. Already part of the build through yara-x.
base64 = "0.23.1"
# The stream cipher that makes a quarantined file unusable as it lies on
# disk, and that keeps a rule bundle from being taken for the malware its
# rules describe. From the RustCrypto project, and already part of the
# build: the random number generator that yara-x pulls in is made of it.
# Using it as a cipher adds two small crates of the same project, `cipher`
# and `inout`.
chacha20 = "0.10.2"
clap = { version = "4.6.8", features = ["derive"] }
crossbeam-channel = "0.5.17"
memchr = "2.7"
ctrlc = "3.5.2"
# Random bytes from the operating system, for the key and the name of a
# quarantine entry. Already part of the build through yara-x.
getrandom = "0.4.3"
memmap2 = "0.9.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "serde"] }
# Reads the rule exclusion list. Parsing only: Warden never writes TOML.
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
walkdir = "2.5.0"
# Only the modules that rules in the wild use are built, and the protocol
# buffer code that ships with yara-x is used as it is, which keeps the build
# shorter. Rules that need a module that is not built are skipped and
# counted when a bundle is made.
yara-x = { version = "1.23.0", default-features = false, features = [
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
    "console-module",
    "dotnet-module",
    "elf-module",
    "hash-module",
    "lnk-module",
    "macho-module",
    "math-module",
    "pe-module",
    "string-module",
    "time-module",
] }
# Reads the block map of an app package, which is XML. A read-only parser
# with no dependencies and no unsafe code, and already part of the build
# through yara-x. Warden refuses document types and limits the number of
# elements.
roxmltree = "0.21.2"
# yara-x 1.23.0 was released against a pre-release of rsa. The final rsa
# 0.10.0 moved the PKCS#1 v1.5 types behind a feature that yara-x does not
# ask for, so Warden asks for it. To be removed when yara-x does.
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
# The parser yara-x itself uses, at the same version. It finds where a rule
# starts and ends in a rule file, which is how a rule on the exclusion list
# is taken out. yara-x already depends on it, so nothing new is built.
yara-x-parser = "=1.23.0"
# Pinned exactly: Warden walks archives with the reader in `zip::unstable`,
# which keeps memory use independent of the number of members and may change
# in any release. Only the two deflate variants are built; members packed any
# other way are reported, not unpacked.
zip = { version = "=9.7.0", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }

# Test and benchmark only.
assert_cmd = "2.2.2"
criterion = "0.8.2"
# A second, independent reader of Windows executables. Warden's own reader
# is checked against it in tests. It is already part of the build through
# yara-x, so nothing new is compiled for it.
object = { version = "0.39.1", default-features = false, features = ["read_core", "pe"] }
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.bench]
inherits = "release"
