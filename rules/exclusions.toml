# Rules that Warden leaves out of its rule bundle, and why.
#
# Public YARA rule sets contain rules that flag clean files. A rule gets on
# this list only with evidence: a clean file it flagged, that file's SHA-256,
# the day, and the machine. `warden rules build --exclusions rules/exclusions.toml`
# then leaves the rule out, and the bundle records that it did.
#
# How a rule gets here, and what "clean" rests on, is in docs/RULES.md under
# "Rules that are left out". The measurements are in docs/BENCHMARKS.md.
#
# Fields of an entry:
#   name      the rule's name, exactly as in the rule file
#   reason    one or two sentences on why the rule is left out
#   source    where the rule comes from (optional)
#   note      anything else worth knowing (optional)
#   evidence  one or more clean files the rule flagged:
#     file     path of the file on the machine where it was seen
#     sha256   SHA-256 of the file
#     seen     the day, as a date
#     machine  the machine, in a few words
#     withheld in place of sha256, where the name and the hash of a file
#              would give away something private: the reason. `file` then
#              says what kind of file it is. Nobody else can check such
#              evidence, so it is the exception.
#
# An entry without evidence is refused, and so is a field that is not in this
# list, so a misspelt field cannot be skipped unnoticed.
#
# Four rules that a tool had generated from malware samples were on this list
# until phase 4, for matching library code in clean files. They are back in
# the bundle: the match of a generated rule now counts only together with a
# sign from another layer. docs/RULES.md lists the four rules, the files, and
# what a scan says about those files now, under "Generated rules".

[[rule]]
name = "COD3NYM_DOTNET_Singlefilehost_Bundled_App"
reason = """\
Recognises a way of packaging .NET programs, not malware. Its author gave it \
no score, the package fills in 75, and with that every copy of the single-file \
host that ships with the .NET SDK is reported as suspicious."""
source = "cod3nym/detection-rules, through the YARA Forge core package 20261018"
note = """\
Flagged 20 files, all of them singlefilehost.exe in the .NET SDK. Three are \
listed here; all 20 are in \
docs/benchmarks/2026-11-18-github-windows-runner-software-false-positives.json."""

[[rule.evidence]]
file = 'C:\Program Files\dotnet\packs\Microsoft.NETCore.App.Host.win-x64\10.0.14\runtimes\win-x64\native\singlefilehost.exe'
sha256 = "55b55ef1e98a4c4d1c8ef9d74042f69361a4bb5893ffd350f61042b59594ca8a"
seen = 2026-11-18
machine = "GitHub-hosted Windows runner (Windows Server 2025)"

[[rule.evidence]]
file = 'C:\Program Files\dotnet\packs\Microsoft.NETCore.App.Host.win-x86\10.0.14\runtimes\win-x86\native\singlefilehost.exe'
sha256 = "af21060c5a882280f135fd307ed3fa3d6a0495d271ff5dff473244b2c0a72bc2"
seen = 2026-11-18
machine = "GitHub-hosted Windows runner (Windows Server 2025)"

[[rule.evidence]]
file = 'C:\Program Files\dotnet\packs\Microsoft.NETCore.App.Host.win-arm64\10.0.14\runtimes\win-arm64\native\singlefilehost.exe'
sha256 = "a767db3c45bf7e75f2d662bd7c071d39e63aa7fb2178eb030d9edc2c2c1ba29f"
seen = 2026-11-18
machine = "GitHub-hosted Windows runner (Windows Server 2025)"

# The next five entries come from one run: the installed programs of a
# Windows 11 desktop, C:\Program Files and C:\Program Files (x86), 310,849
# files, on 2026-11-18. Eight rules flagged 13 of them. Three of the eight
# were generated rules, see above; these are the other five.

[[rule]]
name = "DITEKSHEN_INDICATOR_TOOL_UAC_NSISUAC"
reason = """\
Recognises the UAC plug-in of the NSIS installer builder, not malware. \
Installers and uninstallers of ordinary software carry that plug-in, and with \
the rule's score of 75 each of them is reported as suspicious."""
source = "ditekshen/detection, through the YARA Forge core package 20261018"

[[rule.evidence]]
file = 'C:\Program Files\Image-Line\FL Studio 2025\uninstall.exe'
sha256 = "6ac5648118eee90c8a3e7dc1603c04ca15a0a9a2102578f7a82b26b0a6aa010f"
seen = 2026-11-18
machine = "Windows 11 desktop"

[[rule.evidence]]
file = 'C:\Program Files\Image-Line\FL Studio 21\uninstall.exe'
sha256 = "c67af996bed020d187ff7db741d98de654dd795bea9824ec102e1be5ae046919"
seen = 2026-11-18
machine = "Windows 11 desktop"

[[rule]]
name = "SECUINFRA_SUSP_Powershell_Download_Temp_Rundll_1"
reason = """\
Asks for three short strings anywhere in a file of any kind and size: \
"$Env:temp", "downloadfile(" and "rundll32.exe". A large bundle of script \
code has all three without being a downloader."""
source = "SIFalcon/Detection, through the YARA Forge core package 20261018"
note = "The file is a 55 MB archive of the JavaScript modules of Visual Studio Code."

[[rule.evidence]]
file = 'C:\Program Files\Microsoft VS Code\a5b5009513\resources\app\node_modules.asar'
sha256 = "c70847141b1af286b1e29d4d06e12003c8a63f0c974866b307be072197d17c81"
seen = 2026-11-18
machine = "Windows 11 desktop"

[[rule]]
name = "COD3NYM_SUSP_NET_Shellcode_Loader_Indicators_Jan24"
reason = """\
Asks for three of six names of Windows memory and thread functions in a .NET \
program, such as VirtualAlloc and CreateThread. A large .NET program that \
calls into Windows has them without being a loader."""
source = "cod3nym/detection-rules, through the YARA Forge core package 20261018"
note = "The file is part of Clipchamp, a video editor that Microsoft ships with Windows 11."

[[rule.evidence]]
file = 'C:\Program Files\WindowsApps\Clipchamp.Clipchamp_4.7.10220.0_x64__yxz26nhyzhsrt\Clipchamp.Widgets\Clipchamp.Widgets.exe'
sha256 = "753b95dce14613debfab8f2e3b37f9467a8c6581681e76e3f87fd1b35bc98f5b"
seen = 2026-11-18
machine = "Windows 11 desktop"

[[rule]]
name = "COD3NYM_SUSP_OBF_NET_Reactor_Indicators_Jan24"
reason = """\
Recognises programs protected with .NET Reactor, a commercial obfuscator, not \
malware. Software vendors use it to protect their code, and the rule reports \
every program they protect with it as suspicious."""
source = "cod3nym/detection-rules, through the YARA Forge core package 20261018"
note = """\
The two files are described by their kind only, so nobody else can repeat the \
observation. The entry rests more on what the rule looks for, which anyone can \
read in the rule: names of compiler-generated types with an identifier in \
braces added, as .NET Reactor writes them."""

[[rule.evidence]]
file = "the main program of a commercial .NET application protected with .NET Reactor"
withheld = "The name and the hash would show which programs are installed on a private machine."
seen = 2026-11-18
machine = "Windows 11 desktop"

[[rule.evidence]]
file = "a library of the same application"
withheld = "The name and the hash would show which programs are installed on a private machine."
seen = 2026-11-18
machine = "Windows 11 desktop"

[[rule]]
name = "CAPE_Obfuscar"
reason = """\
Recognises the routine with which Obfuscar, an open-source obfuscator for .NET \
programs, decodes strings, not malware. Every program protected with Obfuscar \
has it, and with the rule's score of 75 each is reported as suspicious."""
source = "kevoreilly/CAPEv2, through the YARA Forge core package 20261018"
note = """\
The file is described by its kind only, so nobody else can repeat the \
observation. The entry rests more on what the rule looks for, which anyone can \
read in the rule: one sequence of .NET instructions."""

[[rule.evidence]]
file = "a library of a small .NET utility protected with Obfuscar"
withheld = "The name and the hash would show which programs are installed on a private machine."
seen = 2026-11-18
machine = "Windows 11 desktop"

# The entry below comes from a later run over the same two folders, on
# 2026-11-20: 310,910 files.

[[rule]]
name = "RUSSIANPANDA_Purecrypter"
reason = """\
Asks for four of five short sequences of .NET instructions in a program of \
under 6 MB that has exactly one embedded resource of more than 300 KB. Three \
of the five are ordinary: creating an object, creating one and calling it, \
and the name ResourceManager. The fourth is one of two runs of calls with a \
generic method among them. An ordinary .NET program with one large resource of \
its own can have all of that."""
source = "RussianPanda95/Yara-Rules, through the YARA Forge core package 20261018"
note = """\
The file is part of the Microsoft Defender app from the Microsoft Store. The \
rule flagged nothing in the run of the same folders two days before."""

[[rule.evidence]]
file = 'C:\Program Files\WindowsApps\Microsoft.6365217CE6EB4_102.2611.9002.0_x64__8wekyb3d8bbwe\MicrosoftSecurityApp\xpdAgent.exe'
sha256 = "86f95974cb32af876d64a85b647b042e5aa3d215d8daff481d1f876b1373a8ec"
seen = 2026-11-20
machine = "Windows 11 desktop"
