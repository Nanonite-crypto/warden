name: Windows check

# Runs the tests of the crates that have code or tests for Windows only, on
# Windows and nowhere else. That code cannot be compiled on another system,
# so a change to it gets its first answer here, in a few minutes, before
# the whole of CI is spent on it. Start it by hand, or push a branch named
# win-check/<anything>.
#
# The engine and the quarantine are here. The crates that need the rule
# engine are not: building it takes most of the time CI takes.
on:
  workflow_dispatch:
  push:
    branches: ["win-check/**"]

permissions:
  contents: read

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  test:
    name: Engine and quarantine on Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy -p warden-engine -p warden-quarantine --all-targets --locked -- -D warnings
      # All of them, also after one has failed: a round trip through CI
      # should say everything it can.
      - name: Test
        run: cargo test -p warden-engine -p warden-quarantine --locked --no-fail-fast
