name: False positives

# Scans files that are known to be clean with every layer (signatures, the
# rule bundle, the heuristics) and records what gets flagged anyway: Windows
# system files, and the software that is installed on a hosted runner. It
# also records what the check of signatures changes about that, and who
# signed the files it read.
#
# This reads many gigabytes from a slow disk, so it does not run on every
# change. Start it by hand, or push a branch named fp-run/<anything>.
on:
  workflow_dispatch:
    inputs:
      all_rules:
        description: Use every rule of the package and ignore rules/exclusions.toml (the "before" of a comparison)
        type: boolean
        default: false
  push:
    branches: ["fp-run/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  windows:
    name: Windows system files and common software
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # Whatever of this list is installed on the runner is scanned and
      # surveyed.
      COMMON_SOFTWARE: >-
        C:\Program Files\7-Zip;C:\Program Files\Git;C:\Program Files\Google\Chrome;C:\Program Files\Mozilla Firefox;C:\Program Files\PowerShell;C:\Program Files\dotnet;C:\Program Files\nodejs
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      # Builds the release binary, checks EICAR detection, builds the rule
      # bundle from the pinned YARA Forge package without the rules named in
      # rules\exclusions.toml, and scans all of System32 with it. Results go
      # to target\check\fp.json.
      - name: Windows system files (System32)
        shell: cmd
        run: call scripts\win\check.cmd -SkipTests -SkipBench -RequireEicar -Rules %ALL_RULES%
        env:
          WARDEN_NO_PAUSE: "1"
          # Empty unless the run was started by hand with "all_rules" ticked.
          ALL_RULES: ${{ inputs.all_rules && '-AllRules' || '' }}
      # Exit code 1 means that something was flagged, which is a result, not
      # a failure.
      - name: Common software
        shell: pwsh
        run: |
          $present = @($env:COMMON_SOFTWARE -split ';' | Where-Object { Test-Path -LiteralPath $_ })
          Write-Host "Scanning: $($present -join ', ')"
          & target\release\warden.exe false-positives @present `
            --rules rules\vendor\rules.wrb `
            --label 'GitHub-hosted Windows runner, common software' `
            --no-progress `
            --output target\check\fp-software.json
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0
      # What the check of signatures changes. The two scans above let the
      # match of a bundle's rule yield to the signature of a trusted
      # publisher. These two are the same scans without that, so the
      # difference is what the check took off the list of flagged files.
      - name: The same two scans without the signature check
        shell: pwsh
        run: |
          $software = @($env:COMMON_SOFTWARE -split ';' | Where-Object { Test-Path -LiteralPath $_ })
          $scans = [ordered]@{
            'fp-no-trust'          = @{ Paths = @("$env:SystemRoot\System32"); Label = 'System32' }
            'fp-software-no-trust' = @{ Paths = @($software); Label = 'common software' }
          }
          foreach ($name in $scans.Keys) {
            $scan = $scans[$name]
            & target\release\warden.exe false-positives @($scan.Paths) `
              --rules rules\vendor\rules.wrb --no-trust `
              --label "GitHub-hosted Windows runner, $($scan.Label), without the signature check" `
              --no-progress `
              --output "target\check\$name.json"
            if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          }
          exit 0
      # The exclusion list names clean files that rules flagged. Some of
      # them are on this machine. Who signed them says whether a rule could
      # come off the list if its file's publisher were trusted instead. A
      # step for looking, so it never stops the run.
      - name: Who signed the files the exclusion list names
        continue-on-error: true
        shell: pwsh
        run: |
          $list = Get-Content -LiteralPath rules\exclusions.toml -Raw
          $files = @([regex]::Matches($list, "(?m)^file = '([^']+)'") |
            ForEach-Object { $_.Groups[1].Value } |
            Where-Object { Test-Path -LiteralPath $_ })
          if ($files.Count -eq 0) { Write-Host 'None of those files is on this machine.'; exit 0 }
          & target\release\warden.exe trust check @files
          exit 0
      # Who signed the files of this machine, found by which of the three
      # routes, and what a check costs: every file of System32 and of the
      # software above is checked, not only the few a scan asks about. The
      # signers are named, which is fine on a machine that is the same for
      # everybody.
      - name: Survey who signed what
        shell: pwsh
        run: |
          $software = @($env:COMMON_SOFTWARE -split ';' | Where-Object { Test-Path -LiteralPath $_ })
          $surveys = [ordered]@{
            'trust-system32'    = @{ Paths = @("$env:SystemRoot\System32"); Label = 'System32' }
            'trust-software'    = @{ Paths = @($software); Label = 'common software' }
            'trust-windowsapps' = @{ Paths = @("$env:ProgramFiles\WindowsApps"); Label = 'app packages' }
          }
          foreach ($name in $surveys.Keys) {
            $survey = $surveys[$name]
            $paths = @($survey.Paths | Where-Object { Test-Path -LiteralPath $_ })
            if ($paths.Count -eq 0) { Write-Host "Nothing to survey for $name."; continue }
            Write-Host "::group::$($survey.Label)"
            & target\release\warden.exe trust survey @paths --signers --examples `
              --label "GitHub-hosted Windows runner, $($survey.Label)" `
              --output "target\check\$name.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host '::endgroup::'
          }
      # What the heuristic layer costs: the same folder, mostly executables,
      # scanned with and without it, once next to hash matching alone and
      # once next to the rule bundle. Shared hardware, so the numbers are
      # for comparing the four with each other and nothing else.
      - name: Cost of the heuristic layer
        shell: pwsh
        run: |
          $folder = 'C:\Program Files\PowerShell'
          $variants = [ordered]@{
            'hash'            = @('--no-yara', '--no-heuristics')
            'hash-heuristics' = @('--no-yara')
            'rules'           = @('--rules', 'rules\vendor\rules.wrb', '--no-heuristics')
            'rules-heuristics' = @('--rules', 'rules\vendor\rules.wrb')
          }
          foreach ($name in $variants.Keys) {
            $options = $variants[$name]
            & target\release\warden.exe bench $folder @options --runs 5 `
              --label "GitHub-hosted Windows runner, $name" `
              --output "target\check\bench-$name.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Show the results
        if: always()
        shell: bash
        run: |
          for file in summary.json system.json fp.json fp-software.json fp-no-trust.json fp-software-no-trust.json \
            trust-system32.json trust-software.json trust-windowsapps.json \
            bench-hash.json bench-hash-heuristics.json bench-rules.json bench-rules-heuristics.json; do
            echo "::group::$file"
            cat "target/check/$file" 2>/dev/null || echo "(not written)"
            echo
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: false-positives-windows
          path: target/check/
          if-no-files-found: warn
