name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  lint:
    name: Format, lint, docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints, with warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: API documentation, with warnings as errors
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Checks that the pinned rule package still exists and still has the
      # recorded checksum, and that the fetch script works.
      - name: Fetch the pinned rule package
        run: bash scripts/fetch-rules.sh

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
      - uses: Swatinem/rust-cache@v2
      # The check of who signed a file is tested against real signatures,
      # and the ones that matter most are the ones it has to turn down: a
      # valid signature of a publisher on no trust list, one on a file that
      # was changed afterwards, one that carries Microsoft's names under a
      # root of somebody else's, and a signed app package with a file
      # changed. Nobody hands those out, so this step makes them. For that
      # it tells the machine to trust two root certificates of its own
      # making, which is why the script runs on a hosted runner and nowhere
      # else: the machine is deleted when the job ends.
      - name: Make signed test files
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\signed-test-files.ps1 -Out "%RUNNER_TEMP%\warden-signed"
      # No `shell: bash` here. On Windows this step has to start from
      # PowerShell, the default there: Git Bash switches on the backup
      # privilege of an administrator for every program it starts, and a
      # process with that privilege lists a folder whatever its access
      # rights say. The tests that close a folder have nothing to test then.
      # --no-fail-fast: a failure in one crate does not keep the tests of
      # the others from running, so one run shows everything that is wrong.
      - name: Run the test suite
        run: cargo test --workspace --locked --no-fail-fast
        env:
          # The tests that write the EICAR test file to disk are required to
          # run for real on both systems, in a folder of their own. Hosted
          # runners have no resident antivirus watching it. On a developer's
          # Windows machine these tests stay off unless a folder is excluded
          # for them. See docs/TESTING.md.
          WARDEN_EICAR_DIR: ${{ runner.temp }}/warden-eicar
          WARDEN_REQUIRE_EICAR: "1"
          # So are the tests that take away the right to read a file or to
          # list a folder. Where access rights do not apply to the process,
          # they would pass with a note.
          WARDEN_REQUIRE_ACCESS_TESTS: "1"
          # And the tests of the signature check that need the files made
          # above, or a program of Microsoft's on the machine. They only
          # exist on Windows.
          WARDEN_SIGNED_FIXTURES: ${{ runner.temp }}/warden-signed
          WARDEN_REQUIRE_SIGNED_FIXTURES: "1"
          # And the tests that register a service, tasks, Run values and a
          # Startup shortcut with Windows' own tools, to see Warden remove
          # them and put them back. They run only where this variable says
          # in as many words that the machine may be changed. That is true
          # of a hosted runner, which is deleted when the job ends, and of
          # no developer's machine. They only exist on Windows.
          WARDEN_AUTOSTART_TESTS: this-machine-may-be-changed
      # What the tests assert, for a person to read: what Warden says about
      # each of the files made above and about a few files of Windows, route
      # by route, next to what Windows itself said when they were made.
      - name: Show what the signature check finds
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $warden = 'target\debug\warden.exe'
          if (-not (Test-Path -LiteralPath $warden)) { Write-Host 'warden.exe was not built.'; exit 0 }
          $made = Join-Path $env:RUNNER_TEMP 'warden-signed'
          Write-Host '::group::What Windows said about the test files'
          Get-Content -LiteralPath (Join-Path $made 'fixtures.json') -ErrorAction SilentlyContinue
          Write-Host '::endgroup::'
          Write-Host '::group::The trust list'
          & $warden trust list
          Write-Host '::endgroup::'
          $files = @(
            "$made\plain.exe", "$made\signed.exe", "$made\tampered.exe", "$made\padded.exe", "$made\lookalike.exe",
            "$made\package\notes.txt", "$made\package\tools\tool.exe",
            "$made\package-changed\notes.txt", "$made\package-added\added.txt",
            "$env:SystemRoot\System32\ntdll.dll", "$env:SystemRoot\System32\whoami.exe",
            "$env:SystemRoot\System32\notepad.exe", "$env:SystemRoot\explorer.exe",
            "$env:ProgramFiles\PowerShell\7\pwsh.exe", "$env:ProgramFiles\dotnet\dotnet.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ }
          Write-Host '::group::File by file'
          & $warden trust check @files
          Write-Host '::endgroup::'
          Write-Host '::group::The same as JSON'
          & $warden trust check --json @files
          Write-Host '::endgroup::'
          exit 0
      # The scripts in scripts/win are started by hand, on machines CI
      # never sees. That each of them parses is checked here, in the
      # PowerShell every Windows has and in the newer one.
      - name: Parse the PowerShell scripts
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\win\parse-check.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts\win\parse-check.ps1
          exit $LASTEXITCODE
      # What Warden finds in the four places it looks at for autostart
      # entries, and how long the look takes with this unoptimised build.
      # Shown in full, which is fine on a machine that is the same for
      # everybody. On a person's machine this list says what is installed,
      # and it is never recorded.
      - name: Show what starts programs on this machine
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $warden = 'target\debug\warden.exe'
          if (-not (Test-Path -LiteralPath $warden)) { Write-Host 'warden.exe was not built.'; exit 0 }
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          $listing = & $warden autostart list
          $watch.Stop()
          Write-Host "The look took $($watch.ElapsedMilliseconds) ms."
          Write-Host '::group::warden autostart list'
          $listing
          Write-Host '::endgroup::'
          exit 0
      - name: Take the test roots out of the machine's list again
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github\scripts\signed-test-files.ps1 -Out "%RUNNER_TEMP%\warden-signed" -Remove
      # The tests above read executables that this project builds itself.
      # Windows has a folder full of real ones: they are read with Warden's
      # reader and with a second, independent one, and the two have to agree.
      - name: Compare the reader for executables with a second reader on System32
        if: runner.os == 'Windows'
        shell: bash
        run: cargo test -p warden-pe --test corpus --locked -- --nocapture
        env:
          WARDEN_PE_CORPUS: C:\Windows\System32
          WARDEN_PE_CORPUS_LIMIT: "1500"

  windows-acceptance:
    name: Windows acceptance check
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt --no-self-update
      - uses: Swatinem/rust-cache@v2
      # The same script a developer double-clicks on their own machine, run
      # through the same launcher and Windows PowerShell. It builds the
      # release binary, checks EICAR detection in all three forms, times a
      # look at what Windows starts on the machine, measures scan
      # throughput, builds the rule bundle from the pinned YARA Forge
      # package and counts false positives. The tests already ran in the job
      # above. Everything is pointed at a small folder: a hosted runner's
      # disk is slow on first read, and numbers from shared CI hardware are
      # indicative only. The false-positive run over all of System32 has a
      # workflow of its own.
      - name: Acceptance check
        shell: cmd
        run: call scripts\win\check.cmd -SkipTests -RequireEicar -Rules -BenchPath %SystemRoot%\System32\drivers
        env:
          WARDEN_NO_PAUSE: "1"
      # Who signed the files of this machine, found by which of the three
      # routes, and what a check costs. Three folders that are small enough
      # for every run: drivers, which are signed in catalogues and in the
      # file; an application of Microsoft's; and the folder Windows keeps
      # app packages in. The signers are named, which is fine on a machine
      # that is the same for everybody. All of System32 is surveyed by the
      # false-positive workflow.
      - name: Survey who signed what
        shell: pwsh
        run: |
          $warden = 'target\release\warden.exe'
          $folders = [ordered]@{
            'drivers'     = "$env:SystemRoot\System32\drivers"
            'powershell'  = "$env:ProgramFiles\PowerShell"
            'windowsapps' = "$env:ProgramFiles\WindowsApps"
          }
          foreach ($name in $folders.Keys) {
            $folder = $folders[$name]
            if (-not (Test-Path -LiteralPath $folder)) { Write-Host "$folder is not there."; continue }
            Write-Host "::group::$folder"
            & $warden trust survey $folder --signers --examples `
              --label "GitHub-hosted Windows runner, $folder" `
              --output "target\check\trust-$name.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host '::endgroup::'
          }
      # The run in the virtual machine is done by hand: three runs of a
      # script, with a restart of Windows after the first and the second.
      # A slip in that script costs a person an afternoon, so the script is
      # rehearsed here first, on a machine that may be changed: the same
      # three runs with the same two programs, without the restarts.
      # Everything has to hold except what only a restart can show, which is
      # that Windows starts the dummy through each of the seven entries.
      - name: Rehearse the autostart kit
        shell: pwsh
        run: |
          cargo build --release --locked -p warden-dummy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $kit = Join-Path $env:RUNNER_TEMP 'autostart-kit'
          $out = Join-Path $env:RUNNER_TEMP 'autostart-out'
          New-Item -ItemType Directory -Force -Path $kit | Out-Null
          Copy-Item -Path 'target\release\warden.exe', 'target\release\warden-dummy.exe', 'scripts\win\autostart-remedy.ps1' -Destination $kit
          foreach ($run in 1..3) {
            Write-Host "::group::Run $run"
            powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $kit 'autostart-remedy.ps1') -OutDir $out -SerialPort none
            Write-Host "Run $run ended with exit code $LASTEXITCODE."
            Write-Host '::endgroup::'
          }
          $result = Get-Content -LiteralPath (Join-Path $out 'autostart-remedy.json') -Raw | ConvertFrom-Json
          $wrong = @($result.checks | Where-Object { -not $_.held } | ForEach-Object { $_.check })
          $needRestart = @($wrong | Where-Object { $_ -like 'Windows started the dummy through *' })
          $other = @($wrong | Where-Object { $_ -notlike 'Windows started the dummy through *' })
          Write-Host "$(@($result.checks).Count) checks, of which $($wrong.Count) did not hold."
          Copy-Item -LiteralPath (Join-Path $out 'autostart-remedy.json') -Destination 'target\check\autostart-kit-rehearsal.json'
          if (-not $result.finished) { Write-Host '::error::The third run did not finish.'; exit 1 }
          if ($other.Count -gt 0) { $other | ForEach-Object { Write-Host "::error::Did not hold: $_" }; exit 1 }
          if ($needRestart.Count -ne 7) { Write-Host "::error::$($needRestart.Count) of the 7 checks that need a restart did not hold. Without a restart all 7 should fail."; exit 1 }
          Write-Host 'The rehearsal went as it should: everything held but the seven checks that need a restart.'
          exit 0
      - name: Show the results
        if: always()
        shell: bash
        run: |
          for file in summary.json system.json bench.json fp.json trust-drivers.json trust-powershell.json trust-windowsapps.json autostart.json autostart-kit-rehearsal.json; do
            echo "::group::$file"
            cat "target/check/$file" 2>/dev/null || echo "(not written)"
            echo
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: warden-windows-x64
          path: |
            target/release/warden.exe
            target/check/
          if-no-files-found: warn
