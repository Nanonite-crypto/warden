name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  lint:
    name: Format, lint, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints, with warnings as errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: API documentation, with warnings as errors
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run the test suite
        shell: bash
        run: cargo test --workspace --locked
        env:
          # The tests that write the EICAR test file to disk are required to
          # run for real on both systems, in a folder of their own. Hosted
          # runners have no resident antivirus watching it. On a developer's
          # Windows machine these tests stay off unless a folder is excluded
          # for them. See docs/TESTING.md.
          WARDEN_EICAR_DIR: ${{ runner.temp }}/warden-eicar
          WARDEN_REQUIRE_EICAR: "1"

  windows-acceptance:
    name: Windows acceptance check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      # The same script a developer double-clicks on their own machine, run
      # through the same launcher and Windows PowerShell. It builds the
      # release binary, checks EICAR detection and measures scan throughput.
      # The tests already ran in the job above. Benchmark numbers from shared
      # CI hardware are indicative only.
      - name: Phase 1 acceptance check
        shell: cmd
        run: call scripts\win\phase1-check.cmd -SkipTests -BenchRuns 2 -RequireEicar
        env:
          WARDEN_NO_PAUSE: "1"
      - name: Show the results
        if: always()
        shell: bash
        run: |
          for file in summary.json system.json bench.json; do
            echo "::group::$file"
            cat "target/phase1/$file" 2>/dev/null || echo "(not written)"
            echo
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: warden-windows-x64
          path: |
            target/release/warden.exe
            target/phase1/
          if-no-files-found: warn
