name: Calibration

# Measures the heuristic indicators on the EMBER2024 dataset: how often
# each one applies to malicious and to benign files, which weight follows
# from that, and what the score does at every threshold. The counts in
# calibration/ and the numbers in docs/HEURISTICS.md come from this
# workflow.
#
# The dataset holds features and labels of 3.2 million files. It holds no
# file content: no malware is downloaded or handled here.
#
# A second job counts the same things on real files: the system folder of
# the Windows runner and the software installed on it. The dataset's
# benign files are files somebody uploaded to a scanning service; false
# alarms happen on the files of a Windows installation, so the score is
# checked there as well.
#
# Runs by hand, or when a branch named calib-run/... is pushed: the job
# for installed files if the name goes on with "installed", the job for
# the dataset otherwise. The parts of the dataset to read are listed in
# calibration/sets.txt. Each part is downloaded, counted and deleted
# before the next one, because the parts together are larger than the
# runner's disk.

on:
  workflow_dispatch:
    inputs:
      what:
        description: What to measure
        type: choice
        options: [ember, installed, both]
        default: ember
  push:
    branches: ["calib-run/**"]

permissions:
  contents: read

concurrency:
  group: calibration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-toolchain.toml.
  RUST_TOOLCHAIN: "1.97.0"
  DATASET: https://huggingface.co/datasets/joyce8/EMBER2024/resolve/main

jobs:
  calibrate:
    name: Measure the indicators on EMBER2024
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.what != 'installed') ||
      (github.event_name == 'push' && !startsWith(github.ref_name, 'calib-run/installed'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Build the calibration tool
        run: cargo build --release --locked -p warden-calibrate

      # The largest part is about 24 GB. The preinstalled SDKs that this job
      # does not use take more than that.
      - name: Make room on the disk
        run: |
          df -h / /mnt 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / /mnt 2>/dev/null || true

      - name: Download and count, one part at a time
        run: |
          set -euo pipefail
          mkdir -p counts data
          first=yes
          grep -v '^#' calibration/sets.txt | grep -v '^[[:space:]]*$' | while read -r part; do
            echo "::group::$part"
            curl --fail --location --silent --show-error --retry 5 --retry-delay 10 \
              --output "data/$part.zip" "$DATASET/$part.zip"
            ls -l "data/$part.zip"
            unzip -l "data/$part.zip" | tail -n 5
            if [ "$first" = yes ]; then sample=--sample; else sample=; fi
            first=no
            ./target/release/warden-calibrate collect "data/$part.zip" --out "counts/$part.json" $sample
            rm "data/$part.zip"
            echo "::endgroup::"
          done

      - name: Report
        run: |
          set -euo pipefail
          ./target/release/warden-calibrate merge counts/*.json --out ember2024-counts.json
          ./target/release/warden-calibrate report ember2024-counts.json --json ember2024-report.json
          ls -l ember2024-counts.json ember2024-report.json

      # The counts are small, and everything in the report can be computed
      # from them again. They are printed so that they can be taken from the
      # log, and they go into the repository as calibration/ember2024-counts.zip.
      - name: Print the counts
        run: |
          echo "::group::ember2024-counts.json, gzip, base64"
          echo "-----BEGIN WARDEN COUNTS-----"
          gzip -9 -c ember2024-counts.json | base64 -w 120
          echo "-----END WARDEN COUNTS-----"
          echo "::endgroup::"

      - name: Keep the counts and the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: calibration
          path: |
            ember2024-counts.json
            ember2024-report.json
            counts/
          if-no-files-found: ignore

  installed:
    name: Measure the indicators on installed Windows files
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.what != 'ember') ||
      (github.event_name == 'push' && startsWith(github.ref_name, 'calib-run/installed'))
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Build the calibration tool
        run: cargo build --release --locked -p warden-calibrate
      - name: What this machine is
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "$($os.Caption), version $($os.Version), build $($os.BuildNumber)"
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"

      # Files are read and not changed. The software is whatever of this
      # list is installed: the same list as in the false-positive workflow.
      - name: Count
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force counts | Out-Null
          & target\release\warden-calibrate.exe collect-files --as system C:\Windows\System32 --out counts\system.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wanted = @(
            'C:\Program Files\7-Zip',
            'C:\Program Files\Git',
            'C:\Program Files\Google\Chrome',
            'C:\Program Files\Mozilla Firefox',
            'C:\Program Files\PowerShell',
            'C:\Program Files\dotnet',
            'C:\Program Files\nodejs'
          )
          $present = @($wanted | Where-Object { Test-Path -LiteralPath $_ })
          Write-Host "Software: $($present -join ', ')"
          & target\release\warden-calibrate.exe collect-files --as software @present --out counts\software.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target\release\warden-calibrate.exe merge counts\system.json counts\software.json --out installed-counts.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Print the counts
        shell: bash
        run: |
          echo "::group::installed-counts.json, gzip, base64"
          echo "-----BEGIN WARDEN COUNTS-----"
          gzip -9 -c installed-counts.json | base64 -w 120
          echo "-----END WARDEN COUNTS-----"
          echo "::endgroup::"

      - name: Keep the counts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: calibration-installed
          path: |
            installed-counts.json
            counts/
          if-no-files-found: ignore
