[package]
name = "warden-quarantine"
description = "Warden's quarantine: files are moved out of harm's way, kept in a form that cannot run, and put back exactly as they were."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
warden-sigdb.workspace = true

chacha20.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Two functions of the Windows API, to read and to write the security
# descriptor of an open file. The Rust standard library has nothing for it.
# Microsoft's own bindings, and already part of the build. The functions
# are in "Security"; the type of a file handle, which both take, is in
# "Foundation".
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
